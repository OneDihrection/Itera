# testflight.yml — Created by dimaswisodewo on 03/11/2026.
name: TestFlight
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git show-ref --verify refs/remotes/origin/production
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/production
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Generate project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Archive and upload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios beta
