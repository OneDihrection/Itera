# Author: dimaswisodewo
name: Itera
options:
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
packages:
  # MediaPipe Tasks 1.2.2 (google-ai-edge/mediapipe master on 2026-11-11), pinned so builds do not
  # follow master. Its binaries ship for iOS devices and Simulators, not Mac Catalyst.
  MediaPipe:
    url: https://github.com/google-ai-edge/mediapipe
    revision: 5d426da711f635fc454b631b28c9111571d25714
targets:
  Itera:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      # Linked on iOS only, so the Mac Catalyst build compiles without MediaPipe (canImport fails).
      - package: MediaPipe
        product: MediaPipeTasksVision
        platformFilter: iOS
    sources:
      - path: Itera
        type: group
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.OneDihrection.Itera
        DEVELOPMENT_TEAM: A2WQZ32XVK
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_GENERATE_LOCALIZATION_SYMBOLS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    entitlements:
      path: Generated/Itera.entitlements
      properties:
        # Required on Mac Catalyst, where hardened runtime silently denies capture without them.
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        # Doctor–patient prescriptions and results (SYSTEM_DESIGN ADR-008). The container follows
        # the bundle identifier, so changing PRODUCT_BUNDLE_IDENTIFIER also changes the container.
        # iCloud needs a paid Apple Developer Program team; a free Personal Team cannot use it.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(CFBundleIdentifier)
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: Generated/Info.plist
      properties:
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Bold.ttf
        CFBundleDisplayName: Itera
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Camera access enables on-device exercise tracking.
        NSMicrophoneUsageDescription: Microphone access enables spoken exercise controls.
        NSSpeechRecognitionUsageDescription: Speech recognition enables pause, resume, and stop commands.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  Itera:
    build:
      targets:
        Itera: all
    run:
      config: Debug
    archive:
      config: Release
